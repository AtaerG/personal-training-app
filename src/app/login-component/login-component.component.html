<div class="container mt-5">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">Enter to your super training app</h5>
  
            <!-- Login Form -->
            <form #form="ngForm" (ngSubmit)="onSubmit(form)">
              <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" ngModel id="username" class="form-control"  name="username" required>
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" ngModel id="password" minlength="8" class="form-control"  name="password" required>
              </div>
              <button type="submit" class="btn btn-primary">Enter</button>
            </form>
            <h4 *ngIf="isInvalid"> The password should be at least 8 chars</h4>
          </div>
        </div>
      </div>
    </div>
  </div>
